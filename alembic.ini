# Alembic — database migrations for Etic'Monts.
# The connection comes from the same POSTGRES_* variables as the app
# (see migrations/env.py); nothing secret lives in this file.
#
#   alembic upgrade head          apply every pending migration
#   alembic current               show the database revision
#   alembic history               list migrations
#   alembic revision -m "msg"     create a new (raw SQL) migration

[alembic]
script_location = %(here)s/migrations
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = .
truncate_slug_length = 40

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = logging.StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
