# emb.boblabs.eu — HOST nginx virtual host (the only nginx in the stack).
#
# Installed on the VPS as /etc/nginx/sites-available/emb.conf, symlinked into
# sites-enabled/. TLS is terminated here; everything (pages and /static/) is
# proxied to gunicorn on 127.0.0.1:8085 (APP_PORT in .env).
#
# Certificates: certbot, webroot authenticator (/var/www/certbot, see
# acme.conf), renewed by the snap.certbot.renew timer — works while nginx runs
# and does not touch the other sites of the server.
#
# After editing it on the server:   nginx -t && systemctl reload nginx

# --- Abuse limits (per client IP). Zone names are global to the server: keep
# --- the emb_ prefix (other vhosts use tc_*, tsc_*).
limit_req_zone  $binary_remote_addr zone=emb_relay:1m rate=30r/m;   # Android relay API
limit_req_zone  $binary_remote_addr zone=emb_login:1m rate=10r/m;   # password guessing
limit_conn_zone $binary_remote_addr zone=emb_conn:1m;

server {
    listen 80;
    server_name emb.boblabs.eu;
    include snippets/acme.conf;
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    server_name emb.boblabs.eu;
    ssl_certificate     /etc/letsencrypt/live/emb.boblabs.eu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/emb.boblabs.eu/privkey.pem;
    client_max_body_size 10M;

    # Inherited by every location below.
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto https;
    proxy_redirect     off;

    # Android « EMB Relais » API: signed JSON from one phone. Anything beyond a
    # few requests per minute from an IP is abuse and is cut here, before Flask.
    location /api/relay/ {
        limit_req  zone=emb_relay burst=20 nodelay;
        limit_conn emb_conn 10;
        limit_req_status  429;
        limit_conn_status 429;
        client_max_body_size 512k;
        client_body_timeout  10s;
        proxy_read_timeout   30s;
        proxy_pass http://127.0.0.1:8085;
    }

    location = /login {
        limit_req zone=emb_login burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8085;
    }

    location / {
        proxy_pass http://127.0.0.1:8085;
    }
}
