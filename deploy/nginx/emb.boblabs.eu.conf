# emb.boblabs.eu — HOST nginx virtual host (the only nginx in the stack).
#
# Installed on the VPS as /etc/nginx/sites-available/emb.conf, symlinked into
# sites-enabled/. TLS is terminated here; everything (pages and /static/) is
# proxied to gunicorn on 127.0.0.1:8085 (APP_PORT in .env).
#
# Certificates: certbot, webroot authenticator (/var/www/certbot, see
# acme.conf), renewed by the snap.certbot.renew timer — works while nginx runs
# and does not touch the other sites of the server.
#
# This file matches the vhost already in production (2026-11-02): deploying
# v3 needs no nginx change. After editing it on the server:
#     nginx -t && systemctl reload nginx

server {
    listen 80;
    server_name emb.boblabs.eu;
    include snippets/acme.conf;
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    server_name emb.boblabs.eu;
    ssl_certificate     /etc/letsencrypt/live/emb.boblabs.eu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/emb.boblabs.eu/privkey.pem;
    client_max_body_size 10M;

    location / {
        proxy_pass         http://127.0.0.1:8085;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_redirect     off;
    }
}
