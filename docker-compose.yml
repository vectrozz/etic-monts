# =============================================================================
# Etic'Monts — development
# =============================================================================
#   docker compose up --build        → http://localhost:5003 (Flask dev server, auto-reload)
#
# Migrations run on start (`alembic upgrade head`). Separate project name and
# volume: never collides with the production stack. Code is bind-mounted, so
# edits to eticmonts/, templates/, static/ and migrations/ apply immediately.
# =============================================================================

name: eticmonts-dev

services:
  app-flask:
    build:
      context: ./
      dockerfile: Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      FLASK_ENV: development
      # Dev runs every module (marketplace included); prod only what .env enables.
      FEATURES: ${FEATURES:-all}
      POSTGRES_HOST: postgres-db
      POSTGRES_PORT: "5432"
      POSTGRES_USER: eticmont
      POSTGRES_PASSWORD: eticmont
      POSTGRES_DB: eticmont
    volumes:
      - ./eticmonts:/app/eticmonts
      - ./templates:/app/templates
      - ./static:/app/static
      - ./migrations:/app/migrations
    networks:
      - front-db
    ports:
      - "5003:5010"
    depends_on:
      postgres-db:
        condition: service_healthy
    command: ["sh", "-c", "alembic upgrade head && python3 app.py"]

  postgres-db:
    image: postgres:17
    environment:
      POSTGRES_USER: eticmont
      POSTGRES_PASSWORD: eticmont
      POSTGRES_DB: eticmont
    volumes:
      - postgres-data-dev:/var/lib/postgresql/data
    networks:
      - front-db
    ports:
      - "127.0.0.1:5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eticmont -d eticmont"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data-dev:

networks:
  front-db:
