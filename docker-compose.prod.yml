# =============================================================================
# Etic'Monts — production (VPS)
# =============================================================================
#   Internet ─▶ host nginx (TLS, /etc/nginx/sites-enabled/emb.conf)
#            ─▶ 127.0.0.1:${APP_PORT} ─▶ app-flask (gunicorn, also serves /static)
#                                       ─▶ postgres-db (volume eticmonts_postgres-data)
#
# Deploy with scripts/deploy.sh (backup → pull → build → migrate → restart).
# The postgres-data volume is never recreated; `docker compose down -v` would
# delete it — never use -v.
# =============================================================================

name: eticmonts

services:

  app-flask:
    build:
      context: ./
      dockerfile: Dockerfile
    env_file: .env
    environment:
      FLASK_ENV: production
      POSTGRES_HOST: postgres-db
      POSTGRES_PORT: "5432"
    volumes:
      # User uploads (profile photos) survive image rebuilds.
      - ./static/uploads:/app/static/uploads
    ports:
      # Loopback only: the host nginx is the single public entry point.
      - "127.0.0.1:${APP_PORT:-8085}:8000"
    networks:
      - front-db
    depends_on:
      postgres-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  postgres-db:
    image: postgres:17
    env_file: .env
    environment:
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: "${POSTGRES_DB}"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - "${BACKUP_DIR:-/home/postgres-backups}:/backups"
    networks:
      - front-db
    ports:
      # Loopback only (Docker bypasses UFW). POSTGRES_BIND=0.0.0.0 to open it — not recommended.
      - "${POSTGRES_BIND:-127.0.0.1}:${POSTGRES_EXTERNAL_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres-data:

networks:
  front-db:
